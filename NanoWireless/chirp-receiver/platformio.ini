; PlatformIO project config for the Chirp Receiver on Raspberry Pi Pico W
; Uses the earlephilhower Arduino-Pico core (arduino-pico), which supports
; the Pico W's onboard ADC and gives analogRead()/F()/Serial the same API
; shape as AVR Arduino, so the receiver logic ports over almost unchanged.

[env:picow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_protocol = picotool

board_build.f_cpu = 200000000L


build_flags =
    -O3
