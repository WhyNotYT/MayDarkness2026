; PlatformIO Project Configuration File
; Chirp Receiver -- ESP32 WROOM-32 (I2S ADC DMA + dual-core)

[env:esp32doit-devkit-v1]
platform = espressif32
board = denky32
framework = arduino

; --- Serial monitor ---
monitor_speed = 921600
monitor_filters = esp32_exception_decoder

board_build.f_cpu = 250000000L
; --- Upload ---
upload_speed = 921600

; --- Build flags ---
; -O2 keeps the C/C++ side reasonably fast around the asm hot loop.
; CORE_DEBUG_LEVEL left at default (0); bump to 3-5 if you need
; esp-idf/I2S driver diagnostics while tuning the sample rate.
build_flags =
    -O3
    -DCORE_DEBUG_LEVEL=0


; --- Libraries ---
; None needed beyond what ships with the esp32 Arduino core
; (driver/i2s.h, driver/adc.h are part of the ESP-IDF component bundled
; with the arduino-esp32 framework, not separate PlatformIO libs).
lib_deps =